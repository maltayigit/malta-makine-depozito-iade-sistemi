<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depozito Sistemi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F0F2F5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── TELEFON ÇERÇEVE ── */
  .phone {
    width: 390px;
    min-height: 844px;
    background: #F0F2F5;
    border-radius: 40px;
    box-shadow: 0 0 0 10px #1a1a1a, 0 30px 80px rgba(0,0,0,0.35);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ── STATUS BAR ── */
  .status-bar {
    background: #fff;
    padding: 12px 24px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
  }
  .status-bar .time { font-size: 15px; font-weight: 700; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons svg { width: 16px; height: 16px; }

  /* ── EKRANLAR ── */
  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }

  /* ── LOGIN EKRANI ── */
  #login-screen {
    background: #fff;
    justify-content: center;
    padding: 32px 28px;
    gap: 0;
  }
  .login-icon {
    text-align: center;
    margin-bottom: 16px;
  }
  .login-icon svg { width: 64px; height: 64px; color: #185FA5; }
  .login-title {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: #111;
    margin-bottom: 4px;
  }
  .login-sub {
    text-align: center;
    font-size: 14px;
    color: #888;
    margin-bottom: 28px;
  }
  .field-group { margin-bottom: 14px; }
  .field-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #555;
    margin-bottom: 5px;
    padding-left: 2px;
  }
  .field-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .field-wrap svg {
    position: absolute;
    left: 12px;
    width: 18px;
    height: 18px;
    color: #aaa;
    pointer-events: none;
  }
  .field-wrap input {
    width: 100%;
    padding: 11px 12px 11px 38px;
    border: 1.5px solid #E0E0E0;
    border-radius: 10px;
    font-size: 14px;
    background: #FAFAFA;
    outline: none;
    transition: border-color 0.15s;
  }
  .field-wrap input:focus { border-color: #185FA5; background: #fff; }
  .eye-btn {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    cursor: pointer;
    color: #aaa;
    padding: 4px;
  }
  .eye-btn svg { width: 18px; height: 18px; }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: #185FA5;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s, transform 0.1s;
  }
  .login-btn:hover { background: #1450890; }
  .login-btn:active { transform: scale(0.98); }
  .login-btn.loading { opacity: 0.7; pointer-events: none; }

  /* ── APP BAR ── */
  .app-bar {
    background: #fff;
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #F0F0F0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .app-bar-info .machine-name {
    font-size: 16px;
    font-weight: 700;
    color: #111;
  }
  .app-bar-info .machine-sub {
    font-size: 12px;
    color: #888;
    margin-top: 1px;
  }
  .logout-btn {
    background: none;
    border: 1.5px solid #E0E0E0;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    color: #666;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .logout-btn:hover { border-color: #E05050; color: #E05050; }
  .logout-btn svg { width: 15px; height: 15px; }

  /* ── ANA İÇERİK ── */
  .home-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── MAKİNE KARTI ── */
  .makine-kart {
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px solid;
    transition: all 0.25s;
  }
  .makine-kart.acik {
    background: #E8F5F0;
    border-color: #0F6E56;
  }
  .makine-kart.kapali {
    background: #FCEAEA;
    border-color: #C0392B;
  }
  .makine-kart svg { width: 32px; height: 32px; flex-shrink: 0; }
  .makine-kart.acik svg { color: #0F6E56; }
  .makine-kart.kapali svg { color: #C0392B; }
  .makine-kart-info { flex: 1; }
  .makine-kart-info .label { font-size: 12px; color: #777; }
  .makine-kart-info .deger {
    font-size: 18px;
    font-weight: 700;
    margin-top: 1px;
  }
  .makine-kart.acik .deger { color: #0F6E56; }
  .makine-kart.kapali .deger { color: #C0392B; }

  /* ── TOGGLE ── */
  .toggle {
    width: 50px;
    height: 28px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    top: 3px;
    transition: left 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .toggle.on { background: #0F6E56; }
  .toggle.on::after { left: 25px; }
  .toggle.off { background: #CCC; }
  .toggle.off::after { left: 3px; }

  /* ── TOPLU BUTONLAR ── */
  .toplu-row { display: flex; gap: 10px; }
  .toplu-btn {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: 1.5px solid;
    background: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .toplu-btn svg { width: 16px; height: 16px; }
  .toplu-btn.ac { color: #0F6E56; border-color: #0F6E56; }
  .toplu-btn.ac:hover { background: #E8F5F0; }
  .toplu-btn.kapat { color: #C0392B; border-color: #C0392B; }
  .toplu-btn.kapat:hover { background: #FCEAEA; }

  /* ── KAPAK BAŞLIK ── */
  .kapak-baslik {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kapak-baslik h3 { font-size: 16px; font-weight: 700; color: #111; }
  .acik-badge {
    background: #E6F1FB;
    color: #185FA5;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* ── KAPAK GRİD ── */
  .kapak-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .kapak-kart {
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    border: 1.5px solid;
    transition: all 0.18s;
    user-select: none;
  }
  .kapak-kart.acik {
    background: #E8F5F0;
    border-color: #0F6E56;
  }
  .kapak-kart.kapali {
    background: #fff;
    border-color: #E0E0E0;
  }
  .kapak-kart:active { transform: scale(0.97); }
  .kapak-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: background 0.18s;
  }
  .kapak-kart.acik .kapak-dot { background: #1D9E75; }
  .kapak-kart.kapali .kapak-dot { background: #CCC; }
  .kapak-info { flex: 1; }
  .kapak-no { font-size: 13px; font-weight: 600; color: #111; }
  .kapak-durum { font-size: 11px; margin-top: 1px; }
  .kapak-kart.acik .kapak-durum { color: #0F6E56; }
  .kapak-kart.kapali .kapak-durum { color: #999; }
  .kapak-icon { width: 16px; height: 16px; }
  .kapak-kart.acik .kapak-icon { color: #0F6E56; }
  .kapak-kart.kapali .kapak-icon { color: #CCC; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: flex-end;
    border-radius: 40px;
    overflow: hidden;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px 24px 32px;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .modal p { font-size: 14px; color: #666; margin-bottom: 20px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .modal-btn:hover { opacity: 0.85; }
  .modal-btn.iptal { background: #F0F0F0; color: #444; }
  .modal-btn.cikis { background: #E05050; color: #fff; }

  @media (max-width: 420px) {
    body { background: #fff; align-items: flex-start; }
    .phone {
      width: 100%;
      min-height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }
    .modal-overlay { border-radius: 0; }
  }
</style>
</head>
<body>

<div class="phone" id="phone">

  <!-- STATUS BAR -->
  <div class="status-bar">
    <span class="time" id="clock">09:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4 2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <!-- LOGIN EKRANI -->
  <div class="screen active" id="login-screen">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
        <path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
        <line x1="12" y1="12" x2="12" y2="16"/>
        <circle cx="12" cy="12" r="1" fill="currentColor"/>
      </svg>
    </div>
    <div class="login-title">Depozito Sistemi</div>
    <div class="login-sub">Devam etmek için giriş yapın</div>

    <div class="field-group">
      <label>Makine No</label>
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M17 14v3h3"/></svg>
        <input type="text" id="inp-machine" placeholder="Örn: 001" value="001">
      </div>
    </div>

    <div class="field-group">
      <label>Firma Adı</label>
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <input type="text" id="inp-firma" placeholder="Firma adınız" value="Malta">
      </div>
    </div>

    <div class="field-group">
      <label>Yetkili İsim</label>
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="inp-yetkili" placeholder="Adınız Soyadınız" value="Murat Kaya">
      </div>
    </div>

    <div class="field-group">
      <label>Şifre</label>
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <input type="password" id="inp-sifre" placeholder="••••••" value="1234">
        <button class="eye-btn" onclick="toggleSifre()">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="login-btn" id="login-btn" onclick="girisYap()">Giriş Yap</button>
  </div>

  <!-- ANA EKRAN -->
  <div class="screen" id="home-screen">
    <div class="app-bar">
      <div class="app-bar-info">
        <div class="machine-name" id="bar-machine">Makine #001</div>
        <div class="machine-sub" id="bar-sub">Malta · Murat Kaya</div>
      </div>
      <button class="logout-btn" onclick="cikisModalAc()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Çıkış
      </button>
    </div>

    <div class="home-body">

      <!-- Makine kartı -->
      <div class="makine-kart kapali" id="makine-kart">
        <svg id="makine-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div class="makine-kart-info">
          <div class="label">Makine Durumu</div>
          <div class="deger" id="makine-deger">KAPALI</div>
        </div>
        <button class="toggle off" id="makine-toggle" onclick="makineToggle()"></button>
      </div>

      <!-- Toplu butonlar -->
      <div class="toplu-row">
        <button class="toplu-btn ac" onclick="tumunuAc()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 019.9-1"/></svg>
          Tümünü Aç
        </button>
        <button class="toplu-btn kapat" onclick="tumunuKapat()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Tümünü Kapat
        </button>
      </div>

      <!-- Kapak başlık -->
      <div class="kapak-baslik">
        <h3>Kapaklar</h3>
        <span class="acik-badge" id="acik-badge">0 açık</span>
      </div>

      <!-- Kapak grid -->
      <div class="kapak-grid" id="kapak-grid"></div>

    </div>
  </div>

  <!-- Çıkış modal -->
  <div class="modal-overlay" id="cikis-modal">
    <div class="modal">
      <h3>Çıkış Yap</h3>
      <p>Oturumu kapatmak istediğinize emin misiniz?</p>
      <div class="modal-btns">
        <button class="modal-btn iptal" onclick="cikisModalKapat()">İptal</button>
        <button class="modal-btn cikis" onclick="cikisYap()">Çıkış Yap</button>
      </div>
    </div>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  const state = {
    makineAcik: false,
    kapaklar: Array(10).fill(false),
    machineNo: '001',
    firma: 'Malta Makine',
    yetkili: 'Ahmet Yılmaz',
  };

  // ── Saat ──────────────────────────────────────────────────────────────
  function saatGuncelle() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.getHours().toString().padStart(2,'0') + ':' +
      now.getMinutes().toString().padStart(2,'0');
  }
  saatGuncelle();
  setInterval(saatGuncelle, 10000);

  // ── Şifre göster/gizle ────────────────────────────────────────────────
  function toggleSifre() {
    const inp = document.getElementById('inp-sifre');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  // ── Giriş ─────────────────────────────────────────────────────────────
  function girisYap() {
    const machine = document.getElementById('inp-machine').value.trim();
    const firma   = document.getElementById('inp-firma').value.trim();
    const yetkili = document.getElementById('inp-yetkili').value.trim();
    const sifre   = document.getElementById('inp-sifre').value;

    if (!machine || !firma || !yetkili || !sifre) {
      alert('Lütfen tüm alanları doldurun.');
      return;
    }

    const btn = document.getElementById('login-btn');
    btn.textContent = 'Giriş yapılıyor...';
    btn.classList.add('loading');

    state.machineNo = machine;
    state.firma = firma;
    state.yetkili = yetkili;

    setTimeout(() => {
      btn.textContent = 'Giriş Yap';
      btn.classList.remove('loading');

      document.getElementById('bar-machine').textContent = 'Makine #' + machine;
      document.getElementById('bar-sub').textContent = firma + ' · ' + yetkili;

      kapakGridOlustur();
      goster('home-screen');
    }, 800);
  }

  // ── Ekran geçişi ──────────────────────────────────────────────────────
  function goster(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ── Makine toggle ─────────────────────────────────────────────────────
  function makineToggle() {
    state.makineAcik = !state.makineAcik;
    makineGuncelle();
  }

  function makineGuncelle() {
    const kart    = document.getElementById('makine-kart');
    const toggle  = document.getElementById('makine-toggle');
    const deger   = document.getElementById('makine-deger');
    const icon    = document.getElementById('makine-icon');

    if (state.makineAcik) {
      kart.className = 'makine-kart acik';
      toggle.className = 'toggle on';
      deger.textContent = 'AÇIK';
      icon.innerHTML = '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>';
    } else {
      kart.className = 'makine-kart kapali';
      toggle.className = 'toggle off';
      deger.textContent = 'KAPALI';
      icon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
    }
  }

  const kapakIsimleri = [
    'Tablet Bakım Kapağı', 'Su Tahliye Kapağı', 'Metal Atık kapağı', 'Cam Atık Kapağı', 'Plastik Atık Kapağı',
    'Plastık Kapak Kutusu', 'Ups Kapağı', 'Üst Pano Kapağı', 'Pil Kutusu Kapağı', 'Elektrik Pano Kapağı'
  ];

  // ── Kapak grid ────────────────────────────────────────────────────────
  function kapakGridOlustur() {
    const grid = document.getElementById('kapak-grid');
    grid.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const kart = document.createElement('div');
      kart.className = 'kapak-kart kapali';
      kart.id = 'kapak-' + i;
      kart.onclick = () => kapakToggle(i);
      kart.innerHTML = `
        <div class="kapak-dot"></div>
        <div class="kapak-info">
          <div class="kapak-no">${kapakIsimleri[i]}</div>
          <div class="kapak-durum">Kapalı</div>
        </div>
        <svg class="kapak-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>`;
      grid.appendChild(kart);
    }
    acikBadgeGuncelle();
  }

  function kapakToggle(i) {
    state.kapaklar[i] = !state.kapaklar[i];
    kapakGuncelle(i);
    acikBadgeGuncelle();
  }

  function kapakGuncelle(i) {
    const kart = document.getElementById('kapak-' + i);
    const acik = state.kapaklar[i];
    kart.className = 'kapak-kart ' + (acik ? 'acik' : 'kapali');
    kart.querySelector('.kapak-durum').textContent = acik ? 'Açık' : 'Kapalı';
    kart.querySelector('.kapak-icon').innerHTML = acik
      ? '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 019.9-1"/>'
      : '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>';
  }

  function acikBadgeGuncelle() {
    const sayi = state.kapaklar.filter(Boolean).length;
    document.getElementById('acik-badge').textContent = sayi + ' açık';
  }

  function tumunuAc() {
    state.kapaklar.fill(true);
    for (let i = 0; i < 10; i++) kapakGuncelle(i);
    acikBadgeGuncelle();
  }

  function tumunuKapat() {
    state.kapaklar.fill(false);
    for (let i = 0; i < 10; i++) kapakGuncelle(i);
    acikBadgeGuncelle();
  }

  // ── Çıkış modal ───────────────────────────────────────────────────────
  function cikisModalAc()   { document.getElementById('cikis-modal').classList.add('show'); }
  function cikisModalKapat(){ document.getElementById('cikis-modal').classList.remove('show'); }

  function cikisYap() {
    cikisModalKapat();
    state.makineAcik = false;
    state.kapaklar.fill(false);
    makineGuncelle();
    goster('login-screen');
  }
</script>
</body>
</html>
