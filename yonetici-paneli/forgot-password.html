<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malta Makine — Şifremi Unuttum</title>
<link rel="icon" type="image/svg+xml" href="assets/image/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">

  <input type="checkbox" id="menu-toggle" class="menu-toggle-input">
  <label for="menu-toggle" class="hamburger" aria-label="Marka panelini aç/kapat">
    <span></span><span></span><span></span>
  </label>
  <label for="menu-toggle" class="overlay" aria-hidden="true"></label>

  <div class="auth-shell">

    <section class="auth-brand">
      <div class="mark">
         <div class="mark">
         <div class="mark-glyph" aria-hidden="true">
          <a href="login.html">
        <img src="assets/image/logo.svg" alt="Malta logosu" class="mark-glyph-img">
        </a>
         </div>
         <div class="mark-text">Malta Makine</div>
       </div>
      </div>
      
      <div class="mark-sub">İade Kiosk Sistemleri</div>

      <p class="auth-brand-line">Hesabınıza erişimi<br>güvenle geri kazanın.</p>

      <div class="ticket ticket-auth" aria-hidden="true">
        
      </div>

      <div class="sidebar-foot auth-foot">
        <div class="barcode" aria-hidden="true"></div>
        <span>PANEL SÜRÜM 0.1</span>
      </div>
    </section>

    <section class="auth-form-wrap">
      <div class="auth-form-inner">
        <p class="eyebrow">Yönetim Paneli</p>
        <h1 class="auth-title">Şifrenizi mi unuttunuz?</h1>
        <p class="auth-sub">Kayıtlı e-posta adresinizi girin, size bir sıfırlama bağlantısı gönderelim.</p>

        <form class="auth-form" autocomplete="on">
          <div class="field">
            <label for="email">E-posta</label>
            <input id="email" name="email" type="email" placeholder="ad.soyad@magaza.com" required>
          </div>

          <button class="btn-primary btn-block" type="submit">Sıfırlama bağlantısı gönder</button>
        </form>

        <p class="auth-footnote"><a href="login.html">← Girişe geri dön</a></p>
      </div>
    </section>

  </div>

</body>
</html>
